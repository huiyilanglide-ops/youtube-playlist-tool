name: プレイリスト URL 生成

# スマホからでも実行できるようにするためのワークフロー。
#   - Actions タブの「Run workflow」で手動実行
#   - songs.txt などを編集して commit すると自動で再実行
# 結果はジョブのサマリーに表示される。

on:
  workflow_dispatch:
  push:
    branches:
      - claude/youtube-music-playlist-url-mvqupl
    paths:
      - ytm_playlist.py
      - to_summary.py
      - songs.txt
      - .github/workflows/playlist.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ytmusicapi を導入
        run: |
          python -m pip install --upgrade pip
          pip install ytmusicapi

      - name: ロジックの自己テスト(ネットワーク不要)
        run: python test_offline.py

      - name: 検索して URL を生成
        run: python ytm_playlist.py --songs songs.txt --out-dir out 2>&1 | tee run.log

      - name: サマリーに結果を出力
        if: always()
        run: python to_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: 結果ファイルを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playlist-results
          path: |
            out/
            run.log
          if-no-files-found: warn

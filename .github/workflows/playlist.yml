name: プレイリスト URL 生成

# スマホからでも実行できるようにするためのワークフロー。
#   - Actions タブの「Run workflow」で手動実行
#   - songs.txt / page.json を編集して commit すると自動で再実行
# 結果はジョブのサマリーに表示され、ランディングページが GitHub Pages に公開される。

on:
  workflow_dispatch:
    inputs:
      playlist_url:
        description: 'YouTube Music のプレイリスト URL（空欄なら現状のまま）'
        required: false
        default: ''
  push:
    branches:
      - claude/youtube-music-playlist-url-mvqupl
    paths:
      - ytm_playlist.py
      - to_summary.py
      - make_page.py
      - resolve_playlist.py
      - set_playlist.py
      - sync_playlist.py
      - verify_playlist.py
      - test_all.py
      - songs.txt
      - page.json
      - .github/workflows/playlist.yml

permissions:
  contents: read

concurrency:
  group: playlist-pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    outputs:
      pages_ready: ${{ steps.pagescfg.outcome == 'success' }}
    env:
      HAS_AUTH: ${{ secrets.YTM_OAUTH_JSON != '' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Actions の入力欄に貼られたプレイリスト URL を page.json に反映する。
      # スマホからファイルを編集せずに設定できるようにするため。
      - name: プレイリスト ID を設定
        if: inputs.playlist_url != ''
        env:
          PLAYLIST_URL: ${{ inputs.playlist_url }}
        run: python set_playlist.py --config page.json --value "$PLAYLIST_URL"

      - name: ytmusicapi を導入
        run: |
          python -m pip install --upgrade pip
          pip install ytmusicapi

      - name: 全モジュールの自己テスト(ネットワーク不要)
        run: python test_all.py

      - name: 検索して URL を生成
        run: python ytm_playlist.py --songs songs.txt --out-dir out 2>&1 | tee run.log

      - name: サマリーに結果を出力
        if: always()
        run: python to_summary.py >> "$GITHUB_STEP_SUMMARY"

      # watch_videos のリダイレクト先から list= を拾い、
      # music.youtube.com のリンクを作れるようにする。取れなくても続行。
      # 認証情報が登録されていれば、YouTube Music に本物のプレイリストを
      # 作成/更新して page.json に ID を書き戻す。未登録ならスキップ。
      - name: YouTube Music にプレイリストを作成/更新
        if: env.HAS_AUTH == 'true'
        continue-on-error: true
        env:
          YTM_CLIENT_ID: ${{ secrets.YTM_CLIENT_ID }}
          YTM_CLIENT_SECRET: ${{ secrets.YTM_CLIENT_SECRET }}
          YTM_OAUTH_JSON: ${{ secrets.YTM_OAUTH_JSON }}
        run: python sync_playlist.py --results out/results.json --config page.json

      - name: プレイリスト ID を解決
        continue-on-error: true
        run: python resolve_playlist.py --results out/results.json

      - name: ランディングページを生成
        env:
          PAGE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: python make_page.py --results out/results.json --config page.json --out site/index.html

      # page.json の playlist_id を実際に取得し、実在するか・中身が
      # songs.txt と一致するかをサマリーに出す。認証は不要。
      - name: プレイリストを検証
        continue-on-error: true
        run: python verify_playlist.py --results out/results.json --config page.json

      - name: page.json をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add page.json verify_result.json
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "Update playlist id and verification result [skip ci]"
            git push
          fi

      - name: 結果ファイルを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playlist-results
          path: |
            out/
            site/
            run.log
          if-no-files-found: warn

      # Pages が未設定でも検索結果は失わないよう、ここから先は失敗を許容する。
      - name: Pages の設定
        id: pagescfg
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: ページをアップロード
        if: steps.pagescfg.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Pages が未設定のときの案内
        if: steps.pagescfg.outcome != 'success'
        env:
          SETTINGS_URL: ${{ github.server_url }}/${{ github.repository }}/settings/pages
        run: |
          {
            echo "## ⚠️ ランディングページはまだ公開されていません"
            echo ""
            echo "GitHub Pages が有効になっていないため、公開だけスキップしました。"
            echo "（プレイリストの URL は上に出ています。そちらは問題ありません）"
            echo ""
            echo "**一度だけ設定してください:**"
            echo ""
            echo "1. [$SETTINGS_URL]($SETTINGS_URL) を開く"
            echo "2. **Build and deployment** の **Source** を **GitHub Actions** にする"
            echo "3. Actions タブに戻って **Run workflow** を押す"
            echo ""
            echo "次回以降は自動で公開されます。"
            echo ""
            echo "生成済みのページは Artifacts の \`playlist-results\` の中の"
            echo "\`site/index.html\` からも取り出せます。"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: generate
    if: needs.generate.outputs.pages_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: GitHub Pages に公開
        id: deployment
        uses: actions/deploy-pages@v4

      - name: サマリーに公開 URL を追記
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "## 🔗 公開ページ"
            echo ""
            echo "### [$PAGE_URL]($PAGE_URL)"
            echo ""
            echo "このページを開くと「YouTube Music で開く」ボタンが出ます。"
          } >> "$GITHUB_STEP_SUMMARY"
